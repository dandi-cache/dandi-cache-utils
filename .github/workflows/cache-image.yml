name: Cache Image

# The container build for every DANDI cache, called from each cache repository:
#
#   jobs:
#     Build:
#       uses: dandi-cache/dandi-cache-utils/.github/workflows/cache-image.yml@main
#       secrets: inherit
#
# Tagging is handled here so that a branch build no longer overwrites `:latest`, which was the one
# thing stopping caches from testing an environment change before merging it. `main` publishes
# `:latest` and the commit SHA; any other branch publishes `dev-<branch>` and the SHA; a pull
# request only builds, since it has no credentials to push with.

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "Path to the Dockerfile to build."
        required: false
        type: string
        default: containers/Dockerfile
      target:
        description: "Build stage to target, for multi-stage Dockerfiles."
        required: false
        type: string
        default: ""
      notify-to:
        description: "Comma-separated recipients of the failure notification (no spaces)."
        required: false
        type: string
        default: cody.c.baker.phd@gmail.com

permissions:
  contents: read
  packages: read

jobs:
  BuildAndPush:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Work out the tags for this ref
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Not pushed; named only so the build step has something to label the result with.
            echo "list=${IMAGE}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "list=${IMAGE}:latest,${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            # Slashes and other ref characters are not valid in a tag; flatten them.
            BRANCH=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_.-' '-')
            echo "list=${IMAGE}:dev-${BRANCH},${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Skip authentication on pull requests: those only build the image to validate it.
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets._GITHUB_API_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          push: ${{ github.event_name != 'pull_request' }}
          # A pull request does not push, so load the result locally for the check below.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image carries the shared pipeline
        # A cache image must be built FROM the dandi-cache-utils base, because CI extracts the
        # orchestration from it at run time. Catching a Dockerfile that is not leaves the failure
        # here rather than in the cache's next scheduled update.
        run: |
          IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
          if ! docker run --rm "${IMAGE}" test -f /opt/dandi-cache-utils/bin/update_pipeline.sh; then
            echo "ERROR: ${IMAGE} does not carry /opt/dandi-cache-utils." >&2
            echo "Build it FROM ghcr.io/dandi-cache/dandi-cache-utils:latest (or :nwb)." >&2
            exit 1
          fi
          docker run --rm -v "$PWD":/repo:ro "${IMAGE}" \
            python -c "import dandi_cache_utils; dandi_cache_utils.read_config('/repo/cache.toml')"

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ BuildAndPush ]
    if: ${{ always() && failure() }}
    permissions: {}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache: ${{ github.event.repository.name }} container build"
          to: ${{ inputs.notify-to }}
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "Please check the latest container build of the DANDI Cache: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
