name: Test

# The whole organization's update logic runs on this library, so a regression here breaks every
# cache at once. That is the trade for de-duplicating it, and these tests are the other half of it.

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor; 3.12 is what the runner's system `python3` is, and
        # `update_pipeline.sh` parses `cache.toml` with that before any environment exists;
        # 3.13 is what the container runs.
        python-version: [ "3.11", "3.12", "3.13" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install
        # A virtual environment rather than `--system`: the runner ships one system interpreter, so
        # `--system` can only ever test that one version. `uv venv --python` fetches whichever the
        # matrix asks for.
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python ".[test]"

      - name: Run the tests
        run: .venv/bin/pytest -q

      - name: Check the core imports without third-party packages
        # The pipeline reads `cache.toml` with the runner's bare `python3`. If anything in the core
        # grows an import of boto3, h5py or click, the orchestration breaks before a run starts.
        # Not a lint -- it observes a clean interpreter's `sys.modules`, so it needs the matrix.
        run: .venv/bin/python tests/check_core_imports.py

  ZarrCompatibility:
    # The stores this library writes must be real Zarr stores. `zarr` 3 reads them, but the NWB stack
    # pins `zarr<3`, so the main job above cannot install it and skips these tests. This job installs
    # the package with only `zarr>=3` beside it and runs the tests that need it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python . pytest "zarr>=3" fsspec aiohttp

      - name: Run the Zarr tests
        # `-rs` lists skips, and the check after fails the job if the tests that need zarr 3 were
        # skipped anyway, which would mean it has stopped checking anything.
        run: |
          .venv/bin/pytest -q -rs tests/test_zarr.py tests/test_validate.py | tee zarr-tests.log
          if grep -q "Needs zarr 3" zarr-tests.log; then echo "::error::The zarr 3 tests were skipped."; exit 1; fi
