name: Build and Upload Base Containers

# Builds this repository's own base images, which every cache image is built `FROM`.
#
# Two tags are published from one Dockerfile: `:latest` (the core library plus the S3 and DANDI API
# dependencies) and `:nwb` (the same plus the remote NWB reading stack that the `valid-nwb-file-to-*`
# family shares). A cache picks whichever one it needs in a two-line Dockerfile.
#
# Not the `build-and-publish-image` action, deliberately. That action builds a *cache's* image, and
# the two differ in every part that matters:
#
#   - it publishes one image per repository; this publishes two from one Dockerfile, by target;
#   - it tags `:latest` / `dev-<branch>` / the SHA; this adds the version from `pyproject.toml`,
#     which is the tag a cache pins to hold its orchestration still;
#   - its verification is "was this built FROM the base?" -- which is exactly what cannot be asked
#     of the base. This checks the opposite: that the base carries the vendored pipeline, that both
#     version-resolution routes agree with the tag, and that the system interpreter can parse a
#     real `cache.toml` from the vendored sources with nothing installed.
#
# The action exists because seventeen repositories were maintaining one workflow between them.
# There is exactly one base image build, so there is nothing here to de-duplicate -- and bending
# the shared action to cover it would mean inputs that only its one non-cache caller ever sets.

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "src/**"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  schedule:
    # Monthly: nothing is version-pinned, so the rebuild picks up newer releases of the NWB stack
    # and the DANDI client on a predictable cadence rather than only when someone edits a file.
    - cron: "0 5 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildAndPush:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            suffix: latest
          - target: nwb
            suffix: nwb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Work out the tags for this ref
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dandi-cache-utils
          SUFFIX: ${{ matrix.suffix }}
        run: |
          # The version comes from the tree being built, which is the only place it is written.
          # A cache that wants its orchestration held still pins this tag rather than `:latest`.
          VERSION=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          # The core image's version tag is the bare version; a variant carries its own suffix.
          VERSION_SUFFIX=""
          if [ "${SUFFIX}" != "latest" ]; then
            VERSION_SUFFIX="-${SUFFIX}"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=${IMAGE}:pr-${{ github.event.number }}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "list=${IMAGE}:${SUFFIX},${IMAGE}:${VERSION}${VERSION_SUFFIX},${IMAGE}:${{ github.sha }}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_.-' '-')
            echo "list=${IMAGE}:dev-${BRANCH}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets._GITHUB_API_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          # A pull request does not push, so load the result into the local daemon instead; the
          # verification below needs the image either way.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the vendored pipeline survived the build
        # The image is how the orchestration is distributed, so a build that silently lost the
        # script or the sources would break every cache's next update rather than failing here.
        # This runs on pull requests too: the vendoring is the mechanism the whole design rests on,
        # and it should not first be exercised after merge.
        run: |
          IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
          docker run --rm "${IMAGE}" bash -n /opt/dandi-cache-utils/src/dandi_cache_utils/pipeline/update_pipeline.sh
          # The version is declared once, in `pyproject.toml`, and reaches the image by two routes:
          # the installed distribution's metadata, and -- for the vendored sources, which are
          # imported from `src/` without being installed -- the `pyproject.toml` shipped beside
          # them. Both must agree, and with the tag this image is about to be published under.
          VERSION=$(python3 -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          INSTALLED=$(docker run --rm "${IMAGE}" python -c \
            'import dandi_cache_utils; print(dandi_cache_utils.__version__)')
          # The second route, read the way nothing-is-installed reads it: the system interpreter
          # running the vendored `_version.py` on its own, which falls back to the `pyproject.toml`
          # shipped beside the sources because there is no distribution metadata to find.
          VENDORED=$(docker run --rm "${IMAGE}" /usr/bin/python3 -c \
            'import runpy; print(runpy.run_path("/opt/dandi-cache-utils/src/dandi_cache_utils/_version.py")["__version__"])')
          if [ "${INSTALLED}" != "${VERSION}" ] || [ "${VENDORED}" != "${VERSION}" ]; then
            echo "ERROR: the tree declares ${VERSION}, but the image reports ${INSTALLED} installed" >&2
            echo "       and ${VENDORED} from the vendored sources." >&2
            exit 1
          fi
          docker run --rm "${IMAGE}" test -f /opt/dandi-cache-utils/src/dandi_cache_utils/pipeline/runner-requirements.txt
          # Exercise the exact path the pipeline takes on the runner: the *system* interpreter
          # (outside the image's virtual environment, so nothing is installed) running the
          # vendored `_config.py` as a script to parse a real cache.toml. This is what proves the
          # bootstrap stayed standard-library only in a shipped image, not just in the test matrix.
          docker run --rm -v "$PWD":/repo:ro "${IMAGE}" \
            /usr/bin/python3 /opt/dandi-cache-utils/src/dandi_cache_utils/_config.py \
            /repo/docs/examples/valid-nwb-file-to-number-of-groups/cache.toml
          # And the command itself, which is what the pipeline uses once the runner has an
          # environment: it needs the package installed, so this exercises the other half.
          docker run --rm -v "$PWD":/repo:ro "${IMAGE}" \
            dandi-cache config show /repo/docs/examples/valid-nwb-file-to-number-of-groups/cache.toml

      - name: Run the test suite against the library as installed in the image
        # The `Test` workflow proves the *sources* work on three interpreters. This proves the
        # artifact does: the image is what every cache actually runs, and the tests here import the
        # installed distribution rather than `src/`, because the checkout is mounted at /repo and
        # the package is not under it.
        #
        # It is worth the minute in the `nwb` image especially. On the runner,
        # `check_core_imports.py` passes partly by luck -- boto3, h5py and pynwb are not installed
        # there at all, so the core could hardly import them. In this image they are installed, so
        # the check finally means what it says: the core does not reach for them when it could.
        run: |
          IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
          # The mount is read-only, so bytecode goes to a writable prefix and pytest keeps no cache.
          docker run --rm -v "$PWD":/repo:ro -w /repo -e PYTHONPYCACHEPREFIX=/tmp/pycache "${IMAGE}" \
            bash -c 'pip install --quiet pytest && python -m pytest tests -q -p no:cacheprovider && python tests/check_core_imports.py'

  RebuildCacheImages:
    # Every cache image is built `FROM` the base this workflow just published, and `FROM` resolves
    # at build time -- so a cache keeps whatever base it was last built on. Nothing rebuilt them: a
    # cache's own image build only fires when its Dockerfile or its dependencies change, which a
    # release here is not. A library fix, an orchestration fix, and the monthly refresh of the NWB
    # stack all reached ghcr and stopped there. This is what carries them the rest of the way.
    needs: [ BuildAndPush ]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask every cache to rebuild on the new base
        env:
          GH_TOKEN: ${{ secrets._GITHUB_API_KEY }}
          ORGANIZATION: ${{ github.repository_owner }}
          EVENT_TYPE: base-image-published
          CONFIG_FILE: cache.toml
        run: |
          # A repository is a cache when it declares itself one, so `cache.toml` at the root is the
          # criterion here as everywhere else: a newly migrated cache joins this fan-out without
          # anyone remembering to add it to a list, and a cache that has not migrated yet is not
          # built FROM this base and is correctly left alone. The template declares one too, and is
          # excluded by its template flag.
          REPOSITORIES=$(gh api --paginate "orgs/${ORGANIZATION}/repos" \
            --jq '.[] | select(.archived == false and .is_template == false) | .name')

          # An empty listing means the organization could not be read -- a token that lost its
          # scope, an API change -- rather than that there are no caches, and every check below
          # would then quietly find nothing. That is the silence worth failing on.
          if [ -z "${REPOSITORIES}" ]; then
            echo "ERROR: listed no repositories in ${ORGANIZATION}, so nothing could be asked." >&2
            exit 1
          fi

          DISPATCHED=0
          FAILED=""
          for REPOSITORY in ${REPOSITORIES}; do
            # On its default branch: a cache declares itself one when its migration merges, which
            # is also when it starts being built FROM this base and has something to rebuild for.
            if ! gh api "repos/${ORGANIZATION}/${REPOSITORY}/contents/${CONFIG_FILE}" >/dev/null 2>&1; then
              continue
            fi

            # A cache that has not yet added the trigger accepts the dispatch and does nothing with
            # it, so this is safe to send to every cache and self-healing once one adds it.
            if gh api --method POST "repos/${ORGANIZATION}/${REPOSITORY}/dispatches" \
                 -f "event_type=${EVENT_TYPE}" >/dev/null 2>&1; then
              echo "${REPOSITORY}: asked to rebuild."
              DISPATCHED=$((DISPATCHED + 1))
            else
              echo "${REPOSITORY}: dispatch FAILED." >&2
              FAILED="${FAILED} ${REPOSITORY}"
            fi
          done

          echo "Dispatched to ${DISPATCHED} cache(s)."
          if [ -n "${FAILED}" ]; then
            echo "ERROR: could not ask these caches to rebuild:${FAILED}" >&2
            exit 1
          fi
          # Not an error: a cache declares itself one on its default branch, so a cache whose
          # migration is still an open pull request does not match yet. Said plainly, because once
          # the migrations have merged a run that reaches nobody is worth a look.
          if [ "${DISPATCHED}" -eq 0 ]; then
            echo "No repository declares a ${CONFIG_FILE} on its default branch, so there was nothing to ask."
          fi

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ BuildAndPush, RebuildCacheImages ]
    if: ${{ always() && failure() }}
    permissions: {}
    steps:
      - uses: dawidd6/action-send-mail@v21
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache: dandi-cache-utils base container build"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "Please check the latest base container build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
