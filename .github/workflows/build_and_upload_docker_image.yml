name: Build and Upload Base Containers

# Builds this repository's own base images, which every cache image is built `FROM`.
#
# Two tags are published from one Dockerfile: `:latest` (the core library plus the S3 and DANDI API
# dependencies) and `:nwb` (the same plus the remote NWB reading stack that the `valid-nwb-file-to-*`
# family shares). A cache picks whichever one it needs in a two-line Dockerfile.

permissions:
  contents: read
  packages: read

on:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "src/**"
      - "bin/**"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/**"
      - "bin/**"
      - "containers/**"
      - ".github/workflows/build_and_upload_docker_image.yml"
  schedule:
    # Monthly: nothing is version-pinned, so the rebuild picks up newer releases of the NWB stack
    # and the DANDI client on a predictable cadence rather than only when someone edits a file.
    - cron: "0 5 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildAndPush:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: core
            suffix: latest
          - target: nwb
            suffix: nwb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Work out the tags for this ref
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dandi-cache-utils
          SUFFIX: ${{ matrix.suffix }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=${IMAGE}:pr-${{ github.event.number }}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "list=${IMAGE}:${SUFFIX},${IMAGE}:${{ github.sha }}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          else
            BRANCH=$(printf '%s' "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9_.-' '-')
            echo "list=${IMAGE}:dev-${BRANCH}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets._GITHUB_API_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the vendored pipeline survived the build
        # The image is how the orchestration is distributed, so a build that silently loses the
        # script would break every cache's next update rather than failing here.
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          IMAGE=$(printf '%s' "${{ steps.tags.outputs.list }}" | cut -d, -f1)
          docker run --rm "${IMAGE}" bash -n /opt/dandi-cache-utils/bin/update_pipeline.sh
          docker run --rm "${IMAGE}" python -c "import dandi_cache_utils; print(dandi_cache_utils.__version__)"

  NotifyOnFailure:
    runs-on: ubuntu-latest
    needs: [ BuildAndPush ]
    if: ${{ always() && failure() }}
    permissions: {}
    steps:
      - uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CI Failure: DANDI Cache: dandi-cache-utils base container build"
          to: cody.c.baker.phd@gmail.com  # Add more with comma separation (no spaces)
          from: DANDI Cache <dandi-cache@users.noreply.github.com>
          body: "Please check the latest base container build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
