name: Docs

# Read the Docs builds with `fail_on_warning`, so a broken cross-reference fails the published
# build after merge. Building here with `-W` catches the same thing on the pull request instead.

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install
        run: |
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python -r docs/requirements.txt

      - name: Build the documentation
        run: .venv/bin/python -m sphinx -b html -W docs docs/_build/html
