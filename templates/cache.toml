# The complete declarative description of a DANDI cache.
#
# This one file replaces what used to be spread across `update_pipeline.sh` (the input subdataset
# URLs, paths and branches, the output file names, the entry point, the batch size), the update
# workflow (the image reference), `dataset_description.json`, and constants repeated at the top of
# `code/update.py`. Both the orchestration and the update code read it, so they cannot disagree.

[cache]
# The hyphenated repository name. Everything else is derived from it unless overridden:
#   file_stem  -> the underscored form, so `derivatives/<file_stem>.jsonl`
#   image      -> ghcr.io/dandi-cache/<name>
#   outputs    -> ["<file_stem>.jsonl"]
name = "<cache-name>"

# Declare every derivatives file this cache publishes. Only these reach the `dist` branch, which is
# what keeps a `testing_`-prefixed smoke-run artifact from ever reaching consumers.
# outputs = ["<cache_name>.jsonl"]


# Upstream caches, registered as DataLad input subdatasets and pinned in every run's provenance.
#
# Omit the whole section for a first-in-chain cache that fetches its own inputs over the network;
# nothing is then pinned, and the container must be able to reach the upstream source at run time.
#
# Only `name` is required. `url`, `path`, `branch` and `file` default to the organization's
# conventions, and `format` says how `dataset.read_input()` should parse the file:
#   lookup   one single-key object per line, merged into one mapping   (the usual shape)
#   records  one independent JSON value per line, kept as a list
#   ids      one bare scalar per line, collected into a set
[[inputs]]
name = "<input-cache-name>"
# branch = "derivatives"
# format = "lookup"


# Entry points. `update` always exists and defaults to `code/update.py`; declare extras only when a
# cache genuinely has them, such as a `refresh` that re-assesses what it already recorded.
#
# `limit` is the default batch size for a complete run. Set it only for a cache too heavy to clear
# its backlog in one run; most caches should be incremental and leave it unset.
# [operations.update]
# limit = 500


# Rendered to `dataset_description.json` on both published branches, so no cache has to carry that
# file. `title` defaults to the cache name and `license` to CC-BY-4.0.
[description]
title = "<cache-name>"
authors = ["<Author Name>"]
