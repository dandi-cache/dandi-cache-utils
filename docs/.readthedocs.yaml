# Read the Docs build configuration.
#
# This lives under `docs/` rather than at the repository root, so the project's Read the Docs
# settings must point "Path for .readthedocs.yaml" at `docs/.readthedocs.yaml`.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

python:
  install:
    - requirements: docs/requirements.txt
    # The API reference imports the library. Installing it is cheap: the package itself depends
    # only on `rich-click`, and every module imports without the scientific stack, which is
    # declared in extras the documentation does not need.
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  # The documentation is the reference for every cache in the organization, so a broken
  # cross-reference is a defect rather than a nuisance.
  fail_on_warning: true
