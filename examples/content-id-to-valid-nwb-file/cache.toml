[cache]
name = "content-id-to-valid-nwb-file"

# Three parallel outputs, all keyed by content ID. Declaring them is what lets the pipeline publish
# exactly these to `dist` instead of globbing `derivatives/*.jsonl.gz` and hoping.
outputs = [
    "content_id_to_valid_nwb_file.jsonl",
    "content_id_to_checked_at.jsonl",
    "content_id_to_messages.jsonl",
]

[[inputs]]
name = "content-id-to-nwb-file"

[operations.update]
limit = 500

# The NWB Inspector itself evolves, so what was recorded has to be re-assessed. This used to need
# two bespoke environment variables threaded through the shell script; it is a declared entry point
# now, run by the same pipeline with `OPERATION=refresh`.
[operations.refresh]
label = "Refresh"

[description]
authors = ["Cody Baker"]
